{%load static%}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Article</title>
    <link rel="stylesheet" href="{% static 'cssshki/style1.css' %}">
</head>
<body style="background-color: #121212; display: flex; flex-direction: column; gap: 5px; justify-content: center; align-items: center">
    
    <h1><a href="{% url 'proffile:profile_page' %}" style="color: #ffd755;">Go Back</a></h1>

    <div style=" background-color: #1E1E1E; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 30px; border-radius: 30px; ">
        <form method="post" enctype="multipart/form-data" style="display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px;">
            {% csrf_token %}
            
            {{ form.errors }}
            {{ form.title }} <br>
            {{ form.main_content }} <br>
            {{ form.image }} <br>

            <button type="submit">Create Article</button>
        </form>
    </div>
</body>
</html>
